# `unwrap_used` is denied and `expect_used` warns at the workspace level, and
# the gate runs with `-D warnings`, so both fail outside tests. A test
# that unwraps is saying "this cannot fail, and if it does I want the test to
# fail loudly", which is correct, so exempt tests instead of scattering
# `#[allow]` through them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
