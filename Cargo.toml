[workspace]
members = ["crates/meowctl-common"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/meowshed/meowctl"

[workspace.dependencies]
thiserror = "2"

# Every crate inherits these with `lints.workspace = true`.
[workspace.lints.rust]
# Deny rather than forbid: a crate that genuinely needs `unsafe` can override
# this with an `#![allow]` and a comment saying why, and that override is
# visible in review. `forbid` cannot be overridden at all, which turns a rare
# justified case into a fight with the lint.
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Output belongs to the sinks in `meowctl-tui`, which own the live region and
# the cursor. A stray print writes straight through a frame the renderer is
# mid-way through drawing, and the live writer's whole design rests on knowing
# exactly what it put on screen. Only `meowctl-tui` may print, and it overrides
# these two.
print_stdout = "deny"
print_stderr = "deny"

# `unwrap` in a library turns a recoverable error into a process death, and
# this binary runs on every shell spawn. Tests are exempt through
# `clippy.toml`, and `expect` stays a warning because it carries a message that
# explains the invariant.
unwrap_used = "deny"
expect_used = "warn"

dbg_macro = "deny"
todo = "deny"

# `release` sits inside the development loop: the compat corpus rebuilds it on
# every run, and during parity work something changes every iteration. Thin LTO
# is most of the win for a fraction of the link time.
[profile.release]
lto = "thin"

# `dist` is what ships. Fat LTO with one codegen unit lets the hot paths inline
# across crate boundaries, at a link cost that is fine to pay once in CI. Any
# published measurement should name the profile it came from.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
