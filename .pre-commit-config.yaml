repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint

  - repo: local
    hooks:
      - id: gosec
        name: gosec security scanner
        language: golang
        entry: gosec
        args: [./...]
        pass_filenames: false
        additional_dependencies: [github.com/securego/gosec/v2/cmd/gosec@v2.26.1]

      - id: govulncheck
        name: govulncheck vulnerability scanner
        language: golang
        entry: govulncheck
        args: [./...]
        pass_filenames: false
        additional_dependencies: [golang.org/x/vuln/cmd/govulncheck@latest]

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.14
    hooks:
      - id: trufflehog
        name: Scan for secrets (trufflehog)
