# Prose. `ci.yml` doesn't lint Markdown, and the record under `project/` is
# Markdown: the vision, the specifications, the requirements,
# the decisions and the tasks. An unchecked rule is one that drifts.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - ".markdownlintignore"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - ".markdownlintignore"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Lint
        run: markdownlint-cli2 '**/*.md' '#target' '#node_modules' '#.claude' '#CLAUDE.md'
