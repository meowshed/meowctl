# Publishing a release, and the checksums that make it installable.
#
# `self-update` refuses a release with no `checksums.sri`, so this workflow is
# not optional dressing: a tag without it produces a release nobody can update
# to. See [R-CLI-070] and [R-CLI-071].
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Name it for the platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # The name `self-update` looks for is `meowctl-<target triple>`,
          # which is what the binary reports as its own target.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/meowctl.exe" \
               "dist/meowctl-${{ matrix.target }}"
          else
            cp "target/${{ matrix.target }}/release/meowctl" \
               "dist/meowctl-${{ matrix.target }}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: meowctl-${{ matrix.target }}
          path: dist/meowctl-${{ matrix.target }}
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect the binaries
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      # SHA-384 in standard base64, prefixed `sha384-`: the W3C Subresource
      # Integrity form, which is what `Integrity` computes and what every
      # other download meowctl verifies already uses. One line per asset,
      # `<sri>  <name>`; see [R-COMMON-005].
      - name: Compute the checksums
        working-directory: dist
        run: |
          set -euo pipefail
          : > checksums.sri
          for file in meowctl-*; do
            hash="sha384-$(openssl dgst -sha384 -binary "$file" | openssl base64 -A)"
            printf '%s  %s\n' "$hash" "$file" >> checksums.sri
          done
          cat checksums.sri

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file <(sed -n "/^## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d') \
            dist/*
