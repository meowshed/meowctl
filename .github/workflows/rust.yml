# CI for the v0.2.0 Rust tree. Both trees live on `main`, so the path filter is
# what keeps this workflow off Go-only changes and `ci.yml` off Rust-only ones.
# Neither tree pays for the other, and v0.1.0 stays buildable until M9 because
# the compat corpus diffs against it.
name: Rust

on:
  push:
    branches: [main]
    # Repeated below rather than shared with a YAML anchor, which GitHub
    # Actions does not expand.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - "deny.toml"
      - "tests/compat/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - "deny.toml"
      - "tests/compat/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Formatting is seconds and needs no cache, so it gates the rest.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --workspace --no-tests=pass

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: Advisories and licences
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Checks the corpus harness rather than the rewrite: the committed fixtures
  # must still match what the v0.1.0 binary does. A failure means the fixtures
  # drifted from the oracle, which would make every later comparison meaningless.
  compat:
    name: Compatibility corpus
    # macOS because the fixtures are recorded there. The corpus compares two
    # binaries on one machine, so a macOS recording checked on Linux would
    # report platform differences as rewrite defects. Linux fixtures get
    # recorded when somebody works on Linux.
    runs-on: macos-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build the v0.1.0 oracle
        run: CGO_ENABLED=0 go build -o bin/meowctl ./cmd/meowctl

      - name: Check the fixtures against it
        run: MEOWCTL_COMPAT_SUBJECT=$PWD/bin/meowctl cargo xtask compat check

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Find unused dependencies
        run: cargo machete
