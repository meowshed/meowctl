# Development tooling for meowctl. Run `mise install` once, then `mise run all`.
#
# This branch carries two trees. The Rust tree under `crates/` is v0.2.0 and is
# what the tasks below drive. The Go tree under `cmd/` and `internal/` is
# v0.1.0 and stays buildable until M9, because it is the oracle the compat
# corpus diffs against - which is why golangci-lint and the Go tasks are still
# here.

[tools]
# The compiler, the formatter, the linter, and the language server all come
# from one pinned toolchain, so your editor analyses the code with the same
# rustc that CI compiles it with. `rust-toolchain.toml` pins the same channel
# for anyone who reaches for rustup directly.
rust = { version = "stable", components = "clippy,rustfmt,rust-analyzer,rust-src" }

# Everything `mise tasks` invokes. Prefer a backend that ships a prebuilt
# binary: building nextest from source pulls in `aws-lc-sys`, which needs a C
# toolchain and cmake, and a first `mise install` that compiles a test runner
# for ten minutes is a bad first impression of the repository.
"github:nextest-rs/nextest" = "latest"   # test runner
cargo-deny = "latest"                    # advisories, licences, bans, sources
cargo-insta = "latest"                   # snapshot review
markdownlint-cli2 = "latest"
gh = "latest"

# No prebuilt release exists for these two, so they compile. Both are small and
# neither is on the CI critical path.
"cargo:cargo-machete" = "latest"         # unused dependencies
"cargo:cargo-watch" = "latest"           # re-run clippy on change

# The frozen Go tree, v0.1.0. It stays until the Rust tree replaces it at M9.
go            = "1.25"
golangci-lint = "latest"

"pipx:pre-commit" = "latest"

# rustup's shim in ~/.cargo/bin usually wins on PATH and dispatches on
# RUSTUP_TOOLCHAIN, which mise sets to the toolchain it resolved. mise installs
# rust-analyzer into its own copy, so the bare command can still fail with
# "Unknown binary in official toolchain" - which is what an LSP server that
# crashes with exit code 1 looks like from the outside.
[tasks.setup]
run = "rustup component add rust-analyzer"
description = "Make rust-analyzer resolvable through rustup's shim as well"

[tasks.build]
run = "cargo build --workspace"
description = "Build every crate in debug"

[tasks.build-release]
run = "cargo build --workspace --release"
description = "Build every crate in release"

[tasks.check]
run = "cargo clippy --workspace --all-targets -- -D warnings"
description = "Run clippy with warnings denied"

[tasks.test]
run = "cargo nextest run --workspace --no-tests=pass"
description = "Run all tests with nextest"

[tasks.fmt]
run = "cargo fmt --all"
description = "Format all Rust code"

[tasks.fmt-check]
run = "cargo fmt --all -- --check"
description = "Check formatting without changing files"

[tasks.doc]
run = "cargo doc --workspace --no-deps"
description = "Build the API documentation"

[tasks.deny]
run = "cargo deny check"
description = "Check advisories, licences, bans, and sources"

[tasks.unused-deps]
run = "cargo machete"
description = "Find dependencies nothing uses"

[tasks.lint-md]
run = "markdownlint-cli2 '**/*.md' '#target' '#node_modules' '#.claude' '#CLAUDE.md'"
description = "Lint all Markdown prose (prompt files are excluded: their XML tags are deliberate)"

[tasks.watch]
run = "cargo watch -x 'clippy --workspace --all-targets'"
description = "Re-run clippy on every change"

# The v0.1.0 compatibility corpus. `record` captures what the Go binary does;
# `check` replays the same commands under the Rust binary and diffs.
[tasks.compat-record]
run = "cargo xtask compat record"
description = "Re-record the corpus fixtures from the v0.1.0 binary"
depends = ["go-build"]

[tasks.compat-check]
run = "cargo xtask compat check"
description = "Diff the Rust binary against the recorded v0.1.0 behaviour"

# Checks the harness rather than the rewrite: the committed fixtures must still
# match what the Go binary does. A failure here means the fixtures drifted, not
# that the rewrite is wrong.
[tasks.compat-self-check]
run = "MEOWCTL_COMPAT_SUBJECT=$PWD/bin/meowctl cargo xtask compat check"
description = "Check the committed fixtures against the v0.1.0 binary"
depends = ["go-build"]

# The test matrix includes Windows and the local gate does not. Code behind
# cfg(unix) is where that difference bites, so check the other side before
# pushing rather than after.
[tasks.check-windows]
run = "cargo check --workspace --all-targets --target x86_64-pc-windows-msvc"
description = "Type-check the workspace for Windows"

[tasks.snapshots]
run = "cargo insta review"
description = "Review pending snapshot changes"

# What CI runs, in the order that fails fastest first. Run this before opening
# a pull request.
[tasks.all]
depends = [
  "fmt-check",
  "check",
  "test",
  "doc",
  "deny",
  "unused-deps",
  "lint-md",
]
description = "Everything CI checks"

# The frozen Go tree. These keep v0.1.0 buildable and testable while it serves
# as the parity oracle.
[tasks.go-build]
description = "Build the v0.1.0 Go binary"
run = [
  "mkdir -p bin",
  """CGO_ENABLED=0 go build \
    -ldflags="-s -w \
      -X github.com/meowshed/meowctl/internal/version.Version=$(git describe --tags --exact-match 2>/dev/null || echo dev) \
      -X github.com/meowshed/meowctl/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) \
      -X github.com/meowshed/meowctl/internal/version.BuildDate=$(date -u +%Y-%m-%d)" \
    -o bin/meowctl ./cmd/meowctl""",
]

[tasks.go-test]
description = "Run the Go test suite"
run = "CGO_ENABLED=0 go test -race -count=1 ./..."

[tasks.go-lint]
description = "Run golangci-lint over the Go tree"
run = "golangci-lint run ./..."

[tasks.clean]
description = "Remove build artifacts from both trees"
run = "rm -rf bin target"
