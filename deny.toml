# cargo-deny configuration. `mise run deny` and the Rust CI job both run
# `cargo deny check`, which covers advisories, licences, bans, and sources.

[advisories]
version = 2
yanked = "deny"

# Four crates in starlark-rust's dependency tree carry an "unmaintained"
# advisory. None is a vulnerability: each says the author stopped maintaining
# it, which is worth knowing and is not worth failing a build over when the
# dependency is transitive and we do not choose it.
#
# The alternative was to stop using starlark-rust, which is the whole
# evaluator, or to vendor a patched copy of it, which is a far larger
# commitment than four upstream crates that still work. Revisit whenever
# starlark-rust updates: the right fix is theirs to make, and an ignore that
# outlives its cause is how a security check stops being read.
ignore = [
    "RUSTSEC-2023-0089", # atomic-polyfill, via starlark
    "RUSTSEC-2024-0388", # derivative, via starlark and starlark_syntax
    "RUSTSEC-2025-0057", # fxhash, via starlark
    "RUSTSEC-2024-0436", # paste, via starlark
]

[licenses]
version = 2
# meowctl ships under Apache-2.0 as a static binary people install on their own
# machines, so every dependency has to be compatible with distributing it that
# way. Copyleft licences are absent on purpose: LGPL or GPL would change what
# users may do with the binary they installed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # The Mozilla CA root list, which `webpki-roots` ships as data. A data
    # licence rather than a code one, and permissive: it allows redistribution
    # of the list in a binary, which is the whole use here. It arrives with
    # `ureq` whichever TLS verifier is chosen, so the alternative is not
    # another licence but no TLS.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list above covers the licences the dependencies in
# `docs/design/0.2.0-rust-rewrite.md` §3 carry, so most entries match nothing
# while the workspace holds one crate. Warning about each one would train
# everybody to ignore the output of this check.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are a warning, not an error. A transitive dependency
# lagging one minor version behind is normal, and blocking on it costs more
# than it saves; a duplicate that matters shows up in binary size and gets its
# own issue.
multiple-versions = "warn"

# A wildcard version is how a dependency stops being reproducible, so it is
# denied — except between crates in this workspace, which are path
# dependencies with no version and are resolved from the tree rather than from
# a registry. Requiring a version on those would mean bumping every dependent
# crate on every change for no benefit, since none of them is published.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
