version: "3"

vars:
  BINARY: meowctl
  BUILD_DIR: bin
  CGO_ENABLED: "0"

env:
  CGO_ENABLED: "{{.CGO_ENABLED}}"

tasks:
  build:
    desc: Build the meowctl binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags="-s -w -X github.com/meowshed/meowctl/internal/version.Version={{.VERSION | default \"dev\"}} -X github.com/meowshed/meowctl/internal/version.Commit={{.COMMIT | default \"unknown\"}} -X github.com/meowshed/meowctl/internal/version.BuildDate={{.DATE | default \"unknown\"}}" -o {{.BUILD_DIR}}/{{.BINARY}} ./cmd/meowctl
    vars:
      VERSION:
        sh: git describe --tags --exact-match 2>/dev/null || echo "dev"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      DATE:
        sh: date -u +%Y-%m-%d

  test:
    desc: Run all tests
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  install:
    desc: Install meowctl to GOPATH/bin
    deps: [build]
    cmds:
      - cp {{.BUILD_DIR}}/{{.BINARY}} $(go env GOPATH)/bin/{{.BINARY}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
