version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - gosec
    - misspell
    - unconvert
    - unparam

linters-settings:
  gocyclo:
    min-complexity: 15

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-same-issues: 0
